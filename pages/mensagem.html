        <h2 id="mensagem">Envie sua mensagem de para o Papai Noel</h2>

        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="mensagem">Qual presente você deseja:</label>
            <textarea id="mensagem" placeholder="Escreva qual presente deseja" required></textarea>

            <label for="tradicao">Por qual motivo você deveria ganhar?</label>
            <select id="tradicao">
                <option>Ajudo minha mãe</option>
                <option>Sou bonzinho</option>
                <option>Sou educado</option>
                <option>Ajudo meu Pai</option>
            </select>

            <button type="submit">Enviar mensagem</button>
        </form>
